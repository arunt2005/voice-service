
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice Subtraction Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

    <header>
        <h1>🎤 Voice Subtraction Quiz</h1>
        <p>Answer each subtraction question using your voice</p>
    </header>

    <section class="settings">

        <label for="questionCount">
            Number of Questions:
        </label>

        <select id="questionCount">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="50">50</option>
        </select>

        <button id="startBtn" class="start-btn">
            ▶ Start Quiz
        </button>

        <button id="stopBtn" class="stop-btn" disabled>
            ■ Stop
        </button>

        <button id="resultBtn" class="result-btn">
            📊 Result
        </button>

    </section>


    <main class="quiz-area">

        <div class="question-number" id="questionNumber">
            Question 0 / 20
        </div>

        <div class="timer" id="timer">
            3
        </div>

        <div class="question" id="question">
            Press "Start Quiz"
        </div>

        <div class="listening" id="listening">
            🎤 Waiting...
        </div>

        <div class="answer-display" id="answerDisplay">
            Your answer will appear here
        </div>

        <div class="feedback" id="feedback"></div>

    </main>


    <section class="live-score">

        <div class="score-box">
            <span>Total</span>
            <strong id="totalScore">0</strong>
        </div>

        <div class="score-box answered">
            <span>Answered</span>
            <strong id="answeredScore">0</strong>
        </div>

        <div class="score-box correct">
            <span>Correct</span>
            <strong id="correctScore">0</strong>
        </div>

        <div class="score-box incorrect">
            <span>Incorrect</span>
            <strong id="incorrectScore">0</strong>
        </div>

        <div class="score-box unanswered">
            <span>Not Answered</span>
            <strong id="unansweredScore">0</strong>
        </div>

    </section>


    <section class="result-panel" id="resultPanel">

        <h2>📊 Final Result</h2>

        <div class="result-row">
            <span>Total Questions</span>
            <strong id="resultTotal">0</strong>
        </div>

        <div class="result-row">
            <span>Answered</span>
            <strong id="resultAnswered">0</strong>
        </div>

        <div class="result-row">
            <span>Not Answered</span>
            <strong id="resultUnanswered">0</strong>
        </div>

        <div class="result-row correct-row">
            <span>✓ Correct</span>
            <strong id="resultCorrect">0</strong>
        </div>

        <div class="result-row incorrect-row">
            <span>✗ Incorrect</span>
            <strong id="resultIncorrect">0</strong>
        </div>

        <button id="restartBtn" class="restart-btn">
            🔄 Restart Quiz
        </button>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
