<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Voice Assistant</h1>
    <p class="instructions">Click the microphone button and say a command (e.g., <em>"open google"</em>, <em>"change background to blue"</em>, <em>"time"</em>).</p>

    <!-- Microphone Controls -->
    <div class="mic-container">
      <button id="start-btn" class="mic-btn">
        <svg id="mic-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <span id="status" class="status">Click to speak</span>
    </div>

    <!-- Output Displays -->
    <div class="output-box">
      <h3>You Said:</h3>
      <p id="transcript-output">...</p>
    </div>

    <div class="output-box">
      <h3>System Response:</h3>
      <p id="action-output">Awaiting input...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
